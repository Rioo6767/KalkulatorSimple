<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator Perkalian Tepat</title>
<meta name="description" content="Kalkulator perkalian dengan hasil eksak: bilangan raksasa, pecahan, dan desimal berulang tanpa pembulatan.">
<meta name="theme-color" content="#07060F">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%238B6CFF%22/><path d=%22M10 10l12 12M22 10L10 22%22 stroke=%22white%22 stroke-width=%223.5%22 stroke-linecap=%22round%22/></svg>">
<script>try{var t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark");document.documentElement.dataset.theme=t}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060F;--card:#0D0B1A;--line:#2B2450;--ink:#F4F2FF;--mut:#9A94B8;--acc:#8B6CFF;--accs:rgba(139,108,255,.14);--key:#15122A;--prim:#fff;--primt:#0B0A14;--ok:#2BD99A;--err:#FF7A8A;--glow1:rgba(122,80,255,.28);--glow2:rgba(60,70,255,.18);--dot:rgba(160,140,255,.35)}
[data-theme=light]{--bg:#F5F3FF;--card:#fff;--line:#DAD3F7;--ink:#15112B;--mut:#6B6590;--acc:#6A45FF;--accs:rgba(106,69,255,.10);--key:#F0EDFF;--prim:#15112B;--primt:#fff;--ok:#0E9F6E;--err:#D6334A;--glow1:rgba(140,110,255,.25);--glow2:rgba(255,160,220,.18);--dot:rgba(106,69,255,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:0 12px;transition:background .3s,color .3s}
svg{display:block}
main{width:100%;max-width:440px;padding:14px 0 28px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ib{width:46px;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--accs);color:var(--acc);display:grid;place-items:center;flex:none}
header h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em;flex:1}
header h1 small{display:block;font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:500;letter-spacing:.14em;color:var(--ok);margin-top:2px}
#theme{background:var(--card);color:var(--ink);cursor:pointer}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
nav button{font:inherit;font-weight:700;font-size:14.5px;height:48px;border-radius:15px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
nav button[aria-selected=true]{background:var(--prim);color:var(--primt);border-color:var(--prim)}
section[hidden]{display:none}
.screen{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:14px 16px;min-height:132px;display:flex;flex-direction:column;justify-content:flex-end;text-align:right;font-family:"JetBrains Mono",monospace;margin-bottom:10px}
#expr{color:var(--mut);font-size:15px;min-height:22px;word-break:break-all}
#res{font-size:34px;font-weight:500;word-break:break-all;line-height:1.15;margin-top:2px}
#res.long{font-size:20px}#res.err{color:var(--err);font-size:15px;font-family:"Bricolage Grotesque",sans-serif}
#meta{color:var(--mut);font-size:12px;margin-top:8px;word-break:break-all;line-height:1.45}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips button,.pad button{font:inherit;border:0;cursor:pointer;color:var(--ink);background:var(--key);border-radius:18px;height:58px;font-size:23px;font-weight:500;transition:transform .45s cubic-bezier(.34,1.8,.5,1),box-shadow .2s;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);touch-action:manipulation;user-select:none}
.chips button{height:38px;font-size:14px;font-weight:700;background:transparent;border:1.5px solid var(--acc);color:var(--acc);border-radius:12px;box-shadow:none}
.pad button:active,.chips button:active,.go:active,nav button:active,.ib:active{transform:scale(.88,.8);transition-duration:.07s}
.pad .f{background:var(--accs);color:var(--acc);font-size:19px;font-weight:700}
.pad .o{border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.pad .x{background:var(--acc);color:#fff;font-size:32px;font-weight:700;box-shadow:0 8px 24px -8px var(--acc),inset 0 -3px 0 rgba(0,0,0,.2)}
.pad .eq{background:var(--prim);color:var(--primt);grid-column:span 2;font-weight:800;font-size:28px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hist{margin-top:12px}.hist button{display:block;width:100%;text-align:right;background:none;border:0;border-top:1px solid var(--line);color:var(--mut);font-family:"JetBrains Mono",monospace;font-size:12.5px;padding:9px 2px;word-break:break-all;cursor:pointer}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 6px 2px}
.row{display:flex;gap:8px;margin-bottom:10px}
input{flex:1;min-width:0;font:inherit;font-family:"JetBrains Mono",monospace;font-size:18px;padding:0 14px;height:54px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.go{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:16px;height:54px;padding:0 20px;background:var(--prim);color:var(--primt);cursor:pointer;transition:transform .45s cubic-bezier(.34,1.8,.5,1)}
.list,.big{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:6px 16px;font-family:"JetBrains Mono",monospace}
.list{font-size:14.5px}.list:empty{display:none}
.list div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.list div:first-child{border:0}
.list span:last-child{text-align:right;word-break:break-all}
.big{font-size:22px;line-height:1.55;word-break:break-word;padding:14px 16px}
.big em{font-style:normal;color:var(--acc);font-weight:500}
.note{color:var(--mut);font-size:13px;line-height:1.5;margin:10px 2px 0}
@media (prefers-reduced-motion:reduce){.pad button,.chips button,.go{transition:none}}
nav button{display:flex;align-items:center;justify-content:center;gap:8px}
nav button svg{flex:none;color:var(--acc);transition:transform .45s cubic-bezier(.34,1.8,.5,1)}
nav button[aria-selected=true] svg{color:var(--primt)}
nav button:active svg{transform:scale(.8) rotate(-12deg)}
.pad button svg{margin:auto;pointer-events:none}
.pad .eq svg{width:30px;height:30px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.page-glow{position:fixed;width:90vmax;height:90vmax;border-radius:50%;z-index:0;pointer-events:none;will-change:transform}
.glow-a{left:-45vmax;top:-45vmax;background:radial-gradient(circle,var(--glow1),transparent 65%);animation:driftA 22s ease-in-out infinite alternate}
.glow-b{right:-50vmax;bottom:-45vmax;background:radial-gradient(circle,var(--glow2),transparent 65%);animation:driftB 28s ease-in-out infinite alternate}
@keyframes driftA{to{transform:translate(45vmax,30vmax) scale(1.15)}}
@keyframes driftB{to{transform:translate(-40vmax,-35vmax) scale(1.2)}}
main{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.page-glow{animation:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas><div class="page-glow glow-a"></div><div class="page-glow glow-b"></div>
<main>
<header>
<div class="ib" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2.5" width="16" height="19" rx="4"/><path d="M8 7h8M9 12l3 3m0-3l-3 3M8 18.2h.01M16 18.2h.01"/></svg></div>
<h1>Kalkulator Tepat<small>HASIL EKSAK</small></h1>
<button class="ib" id="theme" type="button" aria-label="Ganti tema terang atau gelap"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z"/></svg></button>
</header>
<nav role="tablist">
<button role="tab" aria-selected="true" data-t="calc"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z" fill="currentColor" stroke="none"/></svg><span>Hitung</span></button>
<button role="tab" aria-selected="false" data-t="table"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/><path d="M12 8l4 4-4 4-4-4z"/></svg><span>Tabel ×</span></button>
<button role="tab" aria-selected="false" data-t="prime"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span>Faktor ×</span></button>
</nav>

<section id="calc">
<div class="screen"><div id="expr"></div><div id="res">0</div><div id="meta"></div></div>
<div class="chips" aria-label="Pintasan perkalian">
<button data-i="^2">x²</button><button data-i="^3">x³</button><button data-i="×10">×10</button><button data-i="×100">×100</button><button data-i="×1000">×1k</button><button data-i="×0.5">×½</button>
</div>
<div class="pad">
<button class="f" data-k="C">AC</button>
<button class="f" data-k="B" aria-label="Hapus"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M13 9.5l5 5m0-5l-5 5"/></svg></button>
<button class="f" data-i="(">(</button><button class="f" data-i=")">)</button>
<button class="f" data-i="^">^</button><button class="f" data-i="!">n!</button><button class="f" data-i="%">%</button><button class="o" data-i="÷" aria-label="Bagi"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><circle cx="12" cy="5.5" r="1.3" fill="currentColor"/><circle cx="12" cy="18.5" r="1.3" fill="currentColor"/></svg></button>
<button data-i="7">7</button><button data-i="8">8</button><button data-i="9">9</button><button class="x" data-i="×" aria-label="Kali"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
<button data-i="4">4</button><button data-i="5">5</button><button data-i="6">6</button><button class="o" data-i="−" aria-label="Kurang"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
<button data-i="1">1</button><button data-i="2">2</button><button data-i="3">3</button><button class="o" data-i="+" aria-label="Tambah"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<button data-i="0">0</button><button data-i=".">.</button><button class="eq" data-k="=" aria-label="Hitung hasil"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg></button>
</div>
<div class="hist" id="hist"></div>
</section>

<section id="table" hidden>
<label for="tn">Bilangan (boleh desimal atau ekspresi) dan sampai kali ke</label>
<div class="row"><input id="tn" value="7" inputmode="decimal" autocomplete="off"><input id="tm" value="12" inputmode="numeric" style="max-width:90px" aria-label="Sampai kali ke"></div>
<button class="go" id="tgo" style="width:100%;margin-bottom:10px" type="button">Buat tabel ×</button>
<div class="list" id="tl"></div>
<p class="note">Setiap baris dihitung eksak, tanpa galat pembulatan.</p>
</section>

<section id="prime" hidden>
<label for="pn">Bilangan bulat positif</label>
<div class="row"><input id="pn" value="360360" inputmode="numeric" autocomplete="off"><button class="go" id="pgo" type="button">Uraikan</button></div>
<div class="big" id="pr"></div>
<p class="note">Mengurai bilangan menjadi hasil kali bilangan prima. Batas aman: 9.007.199.254.740.991.</p>
</section>
</main>

<script>
"use strict";
const $=s=>document.querySelector(s);
/* ===== Aritmatika pecahan eksak (BigInt) ===== */
const gcd=(a,b)=>{a=a<0n?-a:a;b=b<0n?-b:b;while(b){[a,b]=[b,a%b]}return a};
const Q=(n,d=1n)=>{if(d===0n)throw new Error("Pembagian dengan nol tidak terdefinisi");if(d<0n){n=-n;d=-d}const g=gcd(n,d)||1n;return{n:n/g,d:d/g}};
const add=(a,b)=>Q(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>Q(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>Q(a.n*b.n,a.d*b.d),div=(a,b)=>Q(a.n*b.d,a.d*b.n);
function pow(a,e){
  if(e.d!==1n)throw new Error("Pangkat harus bilangan bulat");
  let k=e.n;if(k>5000n||k<-5000n)throw new Error("Pangkat terlalu besar (maks 5000)");
  const neg=k<0n;if(neg)k=-k;
  if(a.n===0n&&neg)throw new Error("0 tidak bisa dipangkatkan negatif");
  const r=Q(a.n**k,a.d**k);return neg?Q(r.d,r.n):r}
function fact(a){
  if(a.d!==1n||a.n<0n)throw new Error("Faktorial hanya untuk bilangan bulat ≥ 0");
  if(a.n>3000n)throw new Error("Faktorial terlalu besar (maks 3000!)");
  let r=1n;for(let i=2n;i<=a.n;i++)r*=i;return Q(r)}
function parseNum(s){
  const m=/^(\d*)\.?(\d*)$/.exec(s);if(!m||s==="."||s==="")throw new Error("Angka tidak valid");
  const f=m[2]||"";return Q(BigInt((m[1]||"0")+f),10n**BigInt(f.length))}
/* ===== Parser ekspresi ===== */
function evaluate(src){
  const t=[],s=src.trim(),re=/\s*(\d+\.?\d*|\.\d+|[+\-−×x*÷\/^()!%])/gy;let m,pos=0;
  while(pos<s.length&&(m=re.exec(s))){t.push(m[1]);pos=re.lastIndex}
  if(pos<s.length)throw new Error("Karakter tidak dikenali");
  let i=0;const peek=()=>t[i],isNum=x=>x&&/^[\d.]/.test(x);
  function expr(){let v=term();while(peek()==="+"||peek()==="-"||peek()==="−"){const o=t[i++],r=term();v=o==="+"?add(v,r):sub(v,r)}return v}
  function term(){let v=unary();for(;;){const p=peek();
    if(p==="×"||p==="x"||p==="*"){i++;v=mul(v,unary())}
    else if(p==="÷"||p==="/"){i++;v=div(v,unary())}
    else if(p==="("||isNum(p))v=mul(v,unary());
    else break}return v}
  function unary(){const p=peek();if(p==="-"||p==="−"){i++;return mul(Q(-1n),unary())}if(p==="+"){i++;return unary()}return power()}
  function power(){let b=post();if(peek()==="^"){i++;b=pow(b,unary())}return b}
  function post(){let v=prim();while(peek()==="!"||peek()==="%"){const o=t[i++];v=o==="!"?fact(v):div(v,Q(100n))}return v}
  function prim(){const p=t[i++];
    if(p===undefined)throw new Error("Hitungan belum lengkap");
    if(isNum(p))return parseNum(p);
    if(p==="("){const v=expr();if(t[i++]!==")")throw new Error("Kurung belum ditutup");return v}
    throw new Error("Hitungan tidak valid dekat “"+p+"”")}
  if(!t.length)throw new Error("Masukkan hitungan dulu");
  const v=expr();if(i<t.length)throw new Error("Hitungan tidak valid dekat “"+t[i]+"”");return v}
/* ===== Format hasil ===== */
const group=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,".");
function decimal(q,limit=60){
  const neg=q.n<0n,n=neg?-q.n:q.n,ip=n/q.d;let r=n%q.d;const sg=neg?"-":"";
  if(r===0n)return{text:sg+ip,exact:true};
  const seen=new Map(),dig=[];
  while(r!==0n&&dig.length<limit*4){
    if(seen.has(r)){const k=seen.get(r);return{text:sg+ip+"."+dig.slice(0,k).join("")+"("+dig.slice(k).join("")+")",rep:true}}
    seen.set(r,dig.length);r*=10n;dig.push(r/q.d);r%=q.d}
  if(r===0n)return{text:sg+ip+"."+dig.join("")};
  return{text:sg+ip+"."+dig.slice(0,limit).join("")+"…"}}
function show(q){
  const d=decimal(q);let meta;
  if(q.d===1n){const a=String(q.n<0n?-q.n:q.n),len=a.length;meta=len>3?len+" digit · "+group(a).slice(0,110)+(len>34?"…":""):"Bilangan bulat"}
  else meta="Pecahan eksak: "+q.n+"/"+q.d+(d.rep?" · angka di ( ) berulang":"");
  return{main:q.d===1n?String(q.n):d.text,meta}}
const ans=q=>q.d===1n?String(q.n):"("+q.n+"÷"+q.d+")";
/* ===== Layar hitung: hasil hanya muncul saat = ditekan ===== */
let ex="",done=null;const hist=[];
const exEl=$("#expr"),rsEl=$("#res"),mtEl=$("#meta");
function setRes(txt,cls){rsEl.textContent=txt;rsEl.className=(txt.length>14?"long ":"")+(cls||"")}
function render(){
  if(done){exEl.textContent=done.e+" =";setRes(done.r.main);mtEl.textContent=done.r.meta}
  else{exEl.textContent="";setRes(ex||"0");mtEl.textContent=ex?"Tekan = untuk melihat hasil":""}}
function press(k){
  if(k==="C"){ex="";done=null;render();return}
  if(k==="B"){if(done){ex=ans(done.q);done=null}ex=ex.slice(0,-1);render();return}
  if(k==="="){if(!ex||done)return;
    try{const q=evaluate(ex),r=show(q);done={e:ex,r,q};
      hist.unshift(done);if(hist.length>8)hist.pop();renderHist();render()}
    catch(e){setRes(e.message,"err");mtEl.textContent="";exEl.textContent=ex}
    return}
  if(done){ex=/^[\d.(]$/.test(k)?"":ans(done.q);done=null}  /* operator melanjutkan hasil, angka memulai baru */
  ex+=k;render()}
function renderHist(){const h=$("#hist");h.innerHTML="";
  hist.forEach(x=>{const b=document.createElement("button");b.type="button";
    b.textContent=x.e+" = "+(x.r.main.length>48?x.r.main.slice(0,48)+"…":x.r.main);
    b.onclick=()=>{ex=ans(x.q);done=null;render()};h.appendChild(b)})}
$("#calc").addEventListener("click",e=>{const b=e.target.closest("[data-i],[data-k]");if(!b)return;
  try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}
  press(b.dataset.k||b.dataset.i)});
document.addEventListener("keydown",e=>{
  if($("#calc").hidden||e.target.tagName==="INPUT"||e.ctrlKey||e.metaKey)return;
  const k=e.key;
  if(/^[\d.()+^!%]$/.test(k))press(k);
  else if(k==="*"||k==="x"||k==="X")press("×");
  else if(k==="/")press("÷");else if(k==="-")press("−");
  else if(k==="Enter"||k==="="){e.preventDefault();press("=")}
  else if(k==="Backspace")press("B");else if(k==="Escape")press("C")});
/* ===== Tabel × ===== */
function buildTable(){
  const L=$("#tl");L.innerHTML="";
  try{const base=evaluate($("#tn").value);let m=parseInt($("#tm").value,10);
    if(!(m>=1))throw new Error("Isi “sampai kali ke” dengan angka ≥ 1");if(m>200)m=200;
    const bs=show(base).main;
    for(let k=1;k<=m;k++){const d=document.createElement("div");d.innerHTML="<span></span><span></span>";
      d.children[0].textContent=bs+" × "+k;d.children[1].textContent=show(mul(base,Q(BigInt(k)))).main;L.appendChild(d)}}
  catch(e){L.innerHTML="<div><span style='color:var(--err)'></span></div>";L.querySelector("span").textContent=e.message}}
$("#tgo").onclick=buildTable;$("#tn").onkeydown=$("#tm").onkeydown=e=>{if(e.key==="Enter")buildTable()};
/* ===== Faktor prima ===== */
function factorize(){
  const out=$("#pr"),raw=$("#pn").value.replace(/[.\s,]/g,"");
  if(!/^\d+$/.test(raw)||Number(raw)<2){out.textContent="Masukkan bilangan bulat ≥ 2";return}
  let n=Number(raw);if(n>Number.MAX_SAFE_INTEGER){out.textContent="Terlalu besar";return}
  const orig=n,f=[],take=p=>{let c=0;while(n%p===0){n/=p;c++}if(c)f.push([p,c])};
  take(2);take(3);for(let p=5;p*p<=n;p+=6){take(p);take(p+2)}
  if(n>1)f.push([n,1]);
  out.innerHTML=group(String(orig))+" = <em>"+f.map(([p,c])=>c>1?p+"<sup>"+c+"</sup>":""+p).join(" × ")+"</em>"+(f.length===1&&f[0][1]===1?"<br><small>Bilangan prima</small>":"")}
$("#pgo").onclick=factorize;$("#pn").onkeydown=e=>{if(e.key==="Enter")factorize()};
/* ===== Tab & tema ===== */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["calc","table","prime"].forEach(id=>$("#"+id).hidden=id!==b.dataset.t);
  if(b.dataset.t==="table"&&!$("#tl").children.length)buildTable();
  if(b.dataset.t==="prime"&&!$("#pr").textContent)factorize()});
$("#theme").onclick=()=>{const r=document.documentElement,n=r.dataset.theme==="dark"?"light":"dark";
  r.dataset.theme=n;try{localStorage.setItem("theme",n)}catch(_){}
  document.querySelector('meta[name=theme-color]').content=n==="dark"?"#07060F":"#F5F3FF"};
render();
</script>
<script>
(function(){
  const cv=document.getElementById("bg"),cx=cv.getContext("2d"),still=matchMedia("(prefers-reduced-motion:reduce)").matches;
  let W,H,P=[],rgb=[139,108,255],raf;
  const link=140;
  function color(){const v=getComputedStyle(document.documentElement).getPropertyValue("--acc").trim();
    const m=/^#([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(v);if(m)rgb=[parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)]}
  function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
    const n=Math.round(Math.min(80,Math.max(28,W*H/15000)));
    P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.45,vy:(Math.random()-.5)*.45,r:Math.random()*1.4+.9}));}
  function frame(){
    cx.clearRect(0,0,W,H);const c=rgb.join(",");
    for(const p of P){p.x+=p.vx;p.y+=p.vy;
      if(p.x<-10)p.x=W+10;else if(p.x>W+10)p.x=-10;
      if(p.y<-10)p.y=H+10;else if(p.y>H+10)p.y=-10}
    for(let i=0;i<P.length;i++){const a=P[i];
      for(let j=i+1;j<P.length;j++){const b=P[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
        if(d<link*link){cx.strokeStyle="rgba("+c+","+(.22*(1-Math.sqrt(d)/link)).toFixed(3)+")";cx.lineWidth=1;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}
      cx.fillStyle="rgba("+c+",.65)";cx.beginPath();cx.arc(a.x,a.y,a.r,0,6.283);cx.fill()}
    if(!still)raf=requestAnimationFrame(frame)}
  function start(){cancelAnimationFrame(raf);color();frame()}
  size();start();
  addEventListener("resize",()=>{size();if(still)frame()});
  document.addEventListener("visibilitychange",()=>{if(document.hidden)cancelAnimationFrame(raf);else if(!still)start()});
  new MutationObserver(()=>{color();if(still)frame()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
})();
</script>
